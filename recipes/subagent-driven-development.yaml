# Subagent-Driven Development Workflow
# A continuous implementation workflow that dispatches fresh agents per task
# with merged packet-driven review and plan-scoped ledger state.
#
# Key Features:
#   - Fresh agent per task (no context pollution between tasks)
#   - One whole-plan conflict scan before Task 1
#   - Per-task sequential pipeline with merged review convergence
#   - Durable ledger state scoped to the implementation plan
#   - No execution pauses after pre-flight clears
#
# Workflow:
#   1. Parse the plan and initialize its ledger state
#   2. Scan the whole plan once for blocking contradictions
#   3. Run each task in order through its implementation and merged review lifecycle
#   4. Return the ledger path with the final completion status
#
# Usage:
#   amplifier run "execute kenergy:recipes/subagent-driven-development.yaml with plan_path=docs/implementation-plan.md"

name: "subagent-driven-development"
description: "Continuously execute an implementation plan after one conflict pre-flight, with merged review and plan-scoped ledger state"
version: "4.1.1"
author: "Kenergy Bundle"
tags: ["implementation", "subagent", "vdd", "merged-review", "continuous-execution", "foreach", "per-task-pipeline", "checkpoint", "ledger-state", "preflight"]

context:
  plan_path: ""  # Required: Path to the implementation plan file
  worktree_path: "."  # Execution root; defaults to the current project checkout
  execution_root:
    path: ""
    plan_path: ""

rate_limiting:
  max_concurrent_llm: 5
  backoff:
    enabled: true
    initial_delay_ms: 2000

stages:
  # ============================================================================
  # STAGE 1: Continuous Task Execution
  # Parse once, scan once, then dispatch fresh agents through merged review
  # ============================================================================
  - name: "task-execution"
    steps:
      # -----------------------------------------------------------------------
      # Step 0: Resolve and validate the explicit execution root
      # -----------------------------------------------------------------------
      - id: "resolve-execution-root"
        type: "bash"
        timeout: 30
        command: |
          set -eu
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["WORKTREE_PATH"]).expanduser().resolve()
          if not root.is_dir():
              raise SystemExit(f"BLOCKED: execution root not found: {root}")

          git_root = Path(
              subprocess.check_output(
                  ["git", "-C", str(root), "rev-parse", "--show-toplevel"],
                  text=True,
              ).strip()
          ).resolve()
          if git_root != root:
              raise SystemExit(f"BLOCKED: execution root must be the Git worktree root: {root}")

          raw_plan = Path(os.environ["PLAN_PATH"]).expanduser()
          plan = raw_plan.resolve() if raw_plan.is_absolute() else (root / raw_plan).resolve()
          try:
              plan.relative_to(root)
          except ValueError:
              raise SystemExit(f"BLOCKED: plan {plan} is not inside execution root {root}")
          if not plan.is_file():
              raise SystemExit(f"BLOCKED: plan not found in execution root: {plan}")

          print(json.dumps({"path": str(root), "plan_path": str(plan)}))
          PYEOF
        env:
          WORKTREE_PATH: "{{worktree_path}}"
          PLAN_PATH: "{{plan_path}}"
        parse_json: true
        output: "execution_root"

      # -----------------------------------------------------------------------
      # Step 1: Load and Parse Implementation Plan
      # -----------------------------------------------------------------------
      - id: "load-plan"
        agent: "kenergy:plan-writer"
        model_role: "fast"
        prompt: |
          Load the implementation plan from: {{execution_root.plan_path}}
          Execution root: {{execution_root.path}}

          Parse the plan and extract all implementation tasks as a structured list.

          For each task, extract:
          - task_id: Unique identifier or name
          - description: What needs to be implemented
          - goal: The intended outcome of the task
          - spec: The detailed specification/requirements
          - acceptance_criteria: How to verify the task is complete
          - interfaces: Exact Consumes and Produces interfaces for this task
          - files: Files likely to be created or modified
          - dependencies: Any tasks this depends on (if applicable)
          - implementation_model_role: Appropriate implementation role
          - review_model_role: Appropriate review role
          - escalated_model_role: Role for late fix-loop escalation

          Select model roles by engineering judgment, NEVER by file count or word
          count:
          - Mechanical or isolated tasks: implementation role fast or coding.
          - Integration, multi-file, or judgment-heavy tasks: implementation role coding.
          - Architecture- or design-sensitive tasks: implementation role reasoning.
          - Review role: fast for a low-risk mechanical diff, critique for ordinary
            integration or risk, reasoning for architecture-sensitive review.
          - Escalation must follow the ladder fast -> coding -> reasoning ->
            critical-ops and be strictly above the implementation role.

          Return the result as a JSON object with this exact structure:
          {"tasks": [<array of task objects>], "total_tasks": <number>}

          Each task object in the array must have these keys:
          - "task_id": string
          - "description": string
          - "goal": string
          - "spec": string (the detailed specification)
          - "acceptance_criteria": string
          - "interfaces": string with exact Consumes and Produces interfaces
          - "files": array of file paths
          - "dependencies": array of task_ids (empty array if none)
          - "implementation_model_role": "fast", "coding", or "reasoning"
          - "review_model_role": "fast", "critique", or "reasoning"
          - "escalated_model_role": "coding", "reasoning", or "critical-ops"

          The "tasks" key MUST contain the ordered array. Order by dependencies (independent first).

          IMPORTANT: Preserve ALL spec details - they are critical for review.
        output: "plan_data"
        parse_json: true
        timeout: 600

      # -----------------------------------------------------------------------
      # Step 1.1: Validate Plan Structure
      # -----------------------------------------------------------------------
      - id: "validate-plan"
        type: "bash"
        cwd: "{{execution_root.path}}"
        timeout: 30
        command: |
          python3 - << 'PYEOF'
          import json, sys, os

          raw = os.environ.get("PLAN_DATA", "null")
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"ERROR: plan_data is not valid JSON: {e}", file=sys.stderr)
              print(f"Raw plan_data (first 500 chars): {raw[:500]}", file=sys.stderr)
              sys.exit(1)

          if not isinstance(data, dict) or "tasks" not in data:
              print("ERROR: plan_data must be a dict with a 'tasks' key", file=sys.stderr)
              print(f"  type: {type(data).__name__}", file=sys.stderr)
              if isinstance(data, dict):
                  print(f"  keys: {list(data.keys())}", file=sys.stderr)
              print(f"  value (first 500 chars): {json.dumps(data)[:500]}", file=sys.stderr)
              sys.exit(1)

          tasks = data["tasks"]
          if not isinstance(tasks, list):
              print(f"ERROR: plan_data.tasks must be a list, got {type(tasks).__name__}", file=sys.stderr)
              sys.exit(1)

          if len(tasks) == 0:
              print("ERROR: plan_data.tasks is empty - no tasks found in plan", file=sys.stderr)
              sys.exit(1)

          REQUIRED = {
              "task_id",
              "description",
              "goal",
              "spec",
              "acceptance_criteria",
              "interfaces",
              "files",
              "implementation_model_role",
              "review_model_role",
              "escalated_model_role",
          }
          IMPLEMENTATION_ROLE_ORDER = {"fast": 0, "coding": 1, "reasoning": 2}
          REVIEW_ROLES = {"fast", "critique", "reasoning"}
          ESCALATED_ROLE_ORDER = {"coding": 1, "reasoning": 2, "critical-ops": 3}
          for i, task in enumerate(tasks):
              if not isinstance(task, dict):
                  print(f"ERROR: plan_data.tasks[{i}] is {type(task).__name__}, not a dict", file=sys.stderr)
                  print(f"  value: {repr(task)}", file=sys.stderr)
                  sys.exit(1)
              missing = REQUIRED - set(task.keys())
              if missing:
                  tid = task.get("task_id", "UNKNOWN")
                  print(f"ERROR: plan_data.tasks[{i}] (task_id={tid!r}) missing keys: {sorted(missing)}", file=sys.stderr)
                  sys.exit(1)
              for field in (
                  "description",
                  "goal",
                  "spec",
                  "acceptance_criteria",
                  "interfaces",
              ):
                  if not isinstance(task[field], str) or not task[field].strip():
                      print(
                          f"ERROR: plan_data.tasks[{i}] {field} must be a non-empty string",
                          file=sys.stderr,
                      )
                      sys.exit(1)
              implementation_role = task["implementation_model_role"]
              review_role = task["review_model_role"]
              escalated_role = task["escalated_model_role"]
              if implementation_role not in IMPLEMENTATION_ROLE_ORDER:
                  print(
                      f"ERROR: plan_data.tasks[{i}] has invalid implementation_model_role: "
                      f"{implementation_role!r}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              if review_role not in REVIEW_ROLES:
                  print(
                      f"ERROR: plan_data.tasks[{i}] has invalid review_model_role: "
                      f"{review_role!r}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              if escalated_role not in ESCALATED_ROLE_ORDER:
                  print(
                      f"ERROR: plan_data.tasks[{i}] has invalid escalated_model_role: "
                      f"{escalated_role!r}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              if ESCALATED_ROLE_ORDER[escalated_role] <= IMPLEMENTATION_ROLE_ORDER[implementation_role]:
                  print(
                      f"ERROR: plan_data.tasks[{i}] escalation must be above implementation "
                      f"role: {implementation_role!r} -> {escalated_role!r}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          print(f"plan_data validated: {len(tasks)} task(s) ready for execution")
          PYEOF
        env:
          PLAN_DATA: "{{plan_data}}"

      # -----------------------------------------------------------------------
      # Step 1.5: Initialize plan-scoped state
      # -----------------------------------------------------------------------
      - id: "initialize-plan-state"
        type: "bash"
        cwd: "{{execution_root.path}}"
        timeout: 30
        command: |
          set -eu
          python3 - <<'PYEOF'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          raw = Path(os.environ["PLAN_PATH"]).expanduser()
          plan = raw.resolve()
          if not plan.is_file():
              raise SystemExit(f"BLOCKED: plan not found: {plan}")

          slug = re.sub(r"[^a-z0-9]+", "-", plan.stem.lower()).strip("-")
          if not slug:
              raise SystemExit("BLOCKED: plan filename produced an empty slug")

          state_dir = Path(".kenergy") / "sdd" / slug
          briefs = state_dir / "task-briefs"
          packets = state_dir / "review-packages"
          briefs.mkdir(parents=True, exist_ok=True)
          packets.mkdir(parents=True, exist_ok=True)

          # Keep the executor's own state directory out of `git status`
          # without touching the project's tracked .gitignore, which is
          # plan-authored content that finish-mode's clean-tree check (and
          # any task plan re-deriving .gitignore contents) should judge on
          # its own terms. `.git/info/exclude` is git-native, local-only,
          # and shared across worktrees via --git-common-dir.
          git_common_dir = subprocess.run(
              ["git", "rev-parse", "--git-common-dir"],
              capture_output=True,
              text=True,
              check=False,
          )
          if git_common_dir.returncode == 0:
              exclude_path = Path(git_common_dir.stdout.strip()) / "info" / "exclude"
              exclude_path.parent.mkdir(parents=True, exist_ok=True)
              existing = (
                  exclude_path.read_text(encoding="utf-8")
                  if exclude_path.exists()
                  else ""
              )
              if ".kenergy/" not in existing.splitlines():
                  with exclude_path.open("a", encoding="utf-8") as f:
                      if existing and not existing.endswith("\n"):
                          f.write("\n")
                      f.write(".kenergy/\n")

          ledger = state_dir / "ledger.md"
          identity = str(plan)
          first_line = f"# Plan: {identity}"
          if ledger.exists():
              actual = ledger.read_text(encoding="utf-8").splitlines()
              if not actual or actual[0] != first_line:
                  raise SystemExit("BLOCKED: ledger identity mismatch; refusing cross-plan state")
          else:
              ledger.write_text(
                  first_line + "\n\n## Completed Tasks\n\n## Parked Findings\n",
                  encoding="utf-8",
              )

          print(
              json.dumps(
                  {
                      "plan_identity": identity,
                      "plan_slug": slug,
                      "state_dir": str(state_dir),
                      "ledger_path": str(ledger),
                  }
              )
          )
          PYEOF
        env:
          PLAN_PATH: "{{execution_root.plan_path}}"
        parse_json: true
        output: "plan_state"

      # -----------------------------------------------------------------------
      # Step 1.6: Reconcile durable ledger state against Git history
      # -----------------------------------------------------------------------
      - id: "reconcile-plan-state"
        type: "bash"
        cwd: "{{execution_root.path}}"
        timeout: 30
        command: |
          set -eu
          python3 - <<'PYEOF'
          import os
          import re
          import subprocess
          from pathlib import Path

          ledger = Path(os.environ["LEDGER_PATH"]).expanduser()
          if not ledger.is_file():
              raise SystemExit(f"BLOCKED: ledger not found: {ledger}")

          lines = ledger.read_text(encoding="utf-8").splitlines()
          # Compare only durable ledger entries with git log --oneline. This
          # step is read-only and never promotes conversation memory to state.
          log_lines = subprocess.check_output(["git", "log", "--oneline"], text=True).splitlines()
          commit_prefixes = {line.split(maxsplit=1)[0] for line in log_lines if line.strip()}
          entry_pattern = re.compile(
              r"^- \[x\] (?P<task>.+?) — (?P<sha>[0-9a-f]+) — (?P<outcome>.+)$"
          )
          discrepancies = []

          for line in lines:
              if not line.startswith("- [x] "):
                  continue
              match = entry_pattern.match(line)
              if not match:
                  discrepancies.append(f"malformed completed-task entry: {line}")
                  continue
              sha = match.group("sha")
              if not any(sha.startswith(prefix) for prefix in commit_prefixes):
                  discrepancies.append(
                      f"{match.group('task')}: ledger commit {sha} is absent "
                      "from git log --oneline"
                  )

          if discrepancies:
              print("RECONCILIATION: discrepancies found; git history is authoritative")
              for discrepancy in discrepancies:
                  print(f"- {discrepancy}")
          else:
              print("RECONCILIATION: ledger entries match git log --oneline")
          PYEOF
        env:
          LEDGER_PATH: "{{plan_state.ledger_path}}"

      # -----------------------------------------------------------------------
      # Step 2: Scan the complete plan once before Task 1
      # -----------------------------------------------------------------------
      - id: "preflight-conflict-scan"
        agent: "kenergy:plan-writer"
        model_role: "reasoning"
        timeout: 600
        prompt: |
          Perform one pre-flight conflict scan before task execution.

          Read the complete source plan at {{execution_root.plan_path}}. Treat it as the
          authority for plan-wide requirements, including any Global Constraints
          and mandates. Cross-check it against the complete parsed task data and
          plan-scoped state below:

          EXECUTION ROOT:
          {{execution_root.path}}

          PARSED PLAN:
          {{plan_data}}

          PLAN STATE:
          {{plan_state}}

          Scan the whole plan once for actual, load-bearing contradictions:
          1. Requirements in two or more tasks that cannot both be satisfied.
          2. Task requirements that contradict Global Constraints or another
             explicit plan-wide mandate.
          3. Requirements that the merged task review rubric would necessarily
             reject, such as an impossible or self-contradictory verification
             mandate.

          Report only genuine contradictions requiring an authoritative decision.
          Do not flag normal dependencies, implementation risks, stylistic
          preferences, or advisory improvements. Do not implement, edit files,
          or ask questions outside the JSON result.

          Return ONLY valid JSON with exactly one of these shapes:
          {"status":"CLEAR","conflicts":[]}

          {"status":"CONFLICTS","conflicts":[{"tasks":["task-2","task-4"],"constraint":"Global Constraints require Python 3.12 but task-4 pins Python 3.11","question":"Which Python version is authoritative?"}]}

          Use "CLEAR" only when conflicts is exactly an empty array. Use
          "CONFLICTS" only when every conflict has non-empty "tasks",
          "constraint", and "question" fields.
        output: "preflight_conflicts"
        parse_json: true

      - id: "gate-preflight-conflicts"
        type: "bash"
        cwd: "{{execution_root.path}}"
        timeout: 30
        command: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys

          raw = os.environ.get("PREFLIGHT_CONFLICTS", "null")

          def invalid(message):
              print(f"BLOCKED: invalid pre-flight result: {message}", file=sys.stderr)
              raise SystemExit(1)

          try:
              result = json.loads(raw)
          except json.JSONDecodeError as error:
              invalid(f"not valid JSON: {error}")

          if not isinstance(result, dict) or set(result) != {"status", "conflicts"}:
              invalid("expected exactly status and conflicts keys")

          status = result["status"]
          conflicts = result["conflicts"]
          if status not in {"CLEAR", "CONFLICTS"}:
              invalid("status must be CLEAR or CONFLICTS")
          if not isinstance(conflicts, list):
              invalid("conflicts must be an array")

          if status == "CLEAR":
              if conflicts:
                  invalid("CLEAR requires an empty conflicts array")
              print("Pre-flight clear.")
              raise SystemExit(0)

          if not conflicts:
              invalid("CONFLICTS requires at least one conflict")

          validated = []
          for index, conflict in enumerate(conflicts, start=1):
              if not isinstance(conflict, dict) or set(conflict) != {
                  "tasks",
                  "constraint",
                  "question",
              }:
                  invalid(
                      f"conflict {index} must contain exactly tasks, constraint, "
                      "and question"
                  )
              tasks = conflict["tasks"]
              constraint = conflict["constraint"]
              question = conflict["question"]
              if (
                  not isinstance(tasks, list)
                  or not tasks
                  or not all(isinstance(task, str) and task.strip() for task in tasks)
              ):
                  invalid(f"conflict {index} tasks must be a non-empty string array")
              if not isinstance(constraint, str) or not constraint.strip():
                  invalid(f"conflict {index} constraint must be a non-empty string")
              if not isinstance(question, str) or not question.strip():
                  invalid(f"conflict {index} question must be a non-empty string")
              validated.append((tasks, constraint, question))

          print("BLOCKED: PLAN CONFLICTS")
          for tasks, constraint, question in validated:
              print(f"- Tasks: {', '.join(tasks)}")
              print(f"  Constraint: {constraint}")
              print(f"  Question: {question}")
          raise SystemExit(1)
          PYEOF
        env:
          PREFLIGHT_CONFLICTS: "{{preflight_conflicts}}"

      # -----------------------------------------------------------------------
      # Step 3: Continuous Per-Task Pipeline
      # -----------------------------------------------------------------------
      - id: "per-task-pipeline"
        foreach: "{{plan_data.tasks}}"
        as: "current_task"
        parallel: false
        checkpoint_iterations: true
        on_error: "fail"
        type: "recipe"
        recipe: "single-task-pipeline.yaml"
        context:
          current_task: "{{current_task}}"
          worktree_path: "{{execution_root.path}}"
          plan_identity: "{{plan_state.plan_identity}}"
          state_dir: "{{plan_state.state_dir}}"
          ledger_path: "{{plan_state.ledger_path}}"
        collect: "completed_tasks"

      # -----------------------------------------------------------------------
      # Step 4: Concise Completion Summary
      # -----------------------------------------------------------------------
      - id: "completion-summary"
        agent: "kenergy:plan-writer"
        timeout: 120
        model_role: "fast"
        prompt: |
          Return the continuous execution result. The pipeline is fail-fast, so
          reaching this step means every task completed its merged review lifecycle.

          COMPLETED TASKS:
          {{completed_tasks}}

          Return exactly two lines and nothing else:
          STATUS: ALL_TASKS_COMPLETE
          LEDGER: {{plan_state.ledger_path}}
        output: "completion_report"
