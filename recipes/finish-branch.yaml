# Finish Branch Workflow
# Completes a development branch after implementation is done.
#
# Workflow:
#   1. Verify implementation (static analysis + tests if present)
#   2. Summarize what was implemented (files changed, features added)
#   3. Present options for branch disposition
#   4. APPROVAL GATE - User selects option
#   5. Execute the chosen action
#   6. Clean up worktree if appropriate
#
# Options presented:
#   - MERGE: Fast-forward merge to main (requires verification passing)
#   - PR: Create pull request for review
#   - KEEP: Leave branch as-is for later
#   - DISCARD: Delete branch and worktree (abandon work)
#
# Usage:
#   amplifier run "execute kenergy:recipes/finish-branch.yaml"
#   amplifier run "execute kenergy:recipes/finish-branch.yaml with branch_name=feature/my-feature"

name: "finish-branch"
description: "Complete a development branch - verify implementation, present options, execute choice, clean up"
version: "1.0.2"
author: "Kenergy Bundle"
tags: ["git", "branch-management", "workflow", "human-in-loop"]

context:
  branch_name: ""      # Optional: Auto-detected if in worktree
  worktree_path: ""    # Optional: Auto-detected from current directory

stages:
  # ============================================================================
  # STAGE 1: Verify Implementation and Gather Information
  # ============================================================================
  - name: "verify-and-summarize"
    steps:
      - id: "capture-entry-paths"
        type: "bash"
        timeout: 30
        command: |
          set -eu
          python3 - <<'PYEOF'
          import json
          import subprocess
          from pathlib import Path

          supplied = "{{worktree_path}}".strip()
          worktree = Path(supplied).expanduser().resolve() if supplied else Path(
              subprocess.check_output(
                  ["git", "rev-parse", "--show-toplevel"], text=True
              ).strip()
          ).resolve()
          branch = "{{branch_name}}".strip() or subprocess.check_output(
              ["git", "-C", str(worktree), "branch", "--show-current"], text=True
          ).strip()
          common = Path(subprocess.check_output(
              ["git", "-C", str(worktree), "rev-parse", "--path-format=absolute", "--git-common-dir"],
              text=True,
          ).strip()).resolve()
          main_repo = common.parent
          print(json.dumps({
              "worktree_path": str(worktree),
              "branch_name": branch,
              "main_repo_path": str(main_repo),
          }))
          PYEOF
        parse_json: true
        output: "entry_paths"

      - id: "detect-branch-info"
        agent: "foundation:git-ops"
        model_role: "fast"
        prompt: |
          Inspect branch metadata using the immutable entry paths captured before
          any directory-changing operation:

          - Entry worktree: {{entry_paths.worktree_path}}
          - Entry branch: {{entry_paths.branch_name}}
          - Main repository: {{entry_paths.main_repo_path}}

          Run inspection commands from:
            cd "{{entry_paths.worktree_path}}"

          Do not recompute the entry worktree path or entry branch. Use the
          captured values above verbatim.

          Also gather:
          - The main branch name (usually 'main' or 'master')
          - Whether this branch has been pushed to remote
          - Number of commits ahead of main

          Return all this information clearly structured.
        output: "branch_info"

      - id: "verify-implementation"
        agent: "kenergy:implementer"
        model_role: "coding"
        prompt: |
          Verify the implementation is ready for completion.

          Immutable entry paths:
          - Worktree: {{entry_paths.worktree_path}}
          - Branch: {{entry_paths.branch_name}}
          - Main repository: {{entry_paths.main_repo_path}}
          Branch info: {{branch_info}}

          Run all verification commands from:
            cd "{{entry_paths.worktree_path}}"

          Run verification:
          1. Static analysis first (ruff, ty, tsc, oxlint — whatever applies)
             Report: CLEAN or ERRORS (details)
          2. Run tests if they exist (pytest, npm test, cargo test, go test ./...)
             Report: PASS / FAIL (with counts) / NO TESTS
          3. Check git status — confirm everything is committed

          IMPORTANT: Report clearly whether verification PASSED or FAILED.
          Static analysis errors or test failures block the MERGE option.
        output: "verification_results"

      - id: "summarize-changes"
        agent: "kenergy:code-reviewer"
        model_role: "critique"
        prompt: |
          Summarize the changes made on this branch.

          Immutable entry paths:
          - Worktree: {{entry_paths.worktree_path}}
          - Branch: {{entry_paths.branch_name}}
          - Main repository: {{entry_paths.main_repo_path}}
          Branch info: {{branch_info}}

          Run all change-summary commands from:
            cd "{{entry_paths.worktree_path}}"

          Gather and analyze:
          1. Run: git diff main...HEAD --stat (or appropriate main branch)
          2. Run: git log main..HEAD --oneline
          3. Identify files changed, added, deleted

          Create a clear summary including:

          ## Implementation Summary
          - Branch: {{entry_paths.branch_name}}
          - Commits: [count] commits ahead of main
          - Files changed: [count]

          ## What Was Implemented
          [Brief description based on commit messages and file changes]

          ## Files Modified
          - List key files with brief description of changes

          ## Key Changes
          - Bullet points of significant changes

          This summary will be used for PR descriptions if the user chooses that option.
        output: "change_summary"

  # ============================================================================
  # STAGE 2: Present Options (APPROVAL GATE)
  # ============================================================================
  - name: "option-selection"
    steps:
      - id: "present-options"
        agent: "foundation:zen-architect"
        model_role: "reasoning"
        mode: "ARCHITECT"
        prompt: |
          Present the finish options to the user based on verification results.

          Immutable entry paths:
          - Worktree: {{entry_paths.worktree_path}}
          - Branch: {{entry_paths.branch_name}}
          - Main repository: {{entry_paths.main_repo_path}}
          Verification results: {{verification_results}}
          Change summary: {{change_summary}}
          Branch info: {{branch_info}}

          Create a clear options display:

          ======================================================================
          BRANCH READY FOR COMPLETION
          ======================================================================

          ## Verification Status
          [Show static analysis and test pass/fail status prominently]
          [If failed, show what failed]

          ## Changes Summary
          [Brief summary from change_summary]

          ======================================================================
          SELECT AN OPTION
          ======================================================================

          **MERGE** - Fast-forward merge to main
          [Only available if verification passed - show enabled/disabled status]
          - Merges branch directly to main
          - Removes worktree after merge
          - Best for: Ready-to-ship changes

          **PR** - Create Pull Request
          [Always available]
          - Creates PR with implementation summary
          - Keeps branch and worktree intact
          - Best for: Changes needing review

          **KEEP** - Keep branch for later
          [Always available]
          - Leaves everything as-is
          - Branch and worktree remain
          - Best for: Work in progress

          **DISCARD** - Abandon branch
          [Always available - DESTRUCTIVE]
          - Deletes branch (local and remote if pushed)
          - Removes worktree
          - Best for: Abandoned experiments

          ======================================================================

          CRITICAL: If verification failed, clearly indicate that MERGE is NOT available.
          The user must fix issues before merging.
        output: "options_display"

    approval:
      required: true
      prompt: |
        ======================================================================
        SELECT YOUR OPTION
        ======================================================================

        Review the options above and make your selection.

        TO SELECT: Type your choice (MERGE, PR, KEEP, or DISCARD) in the chat,
        then approve this stage.

        Example: "I choose PR" then approve.

        OPTIONS:
        - MERGE - Merge to main (if verification passed)
        - PR - Create pull request
        - KEEP - Keep branch as-is
        - DISCARD - Delete branch and worktree

        ======================================================================
      timeout: 0
      default: "deny"

  # ============================================================================
  # STAGE 3: Execute the Chosen Option
  # ============================================================================
  - name: "execute-choice"
    steps:
      - id: "determine-choice"
        agent: "foundation:git-ops"
        model_role: "fast"
        prompt: |
          Determine which option the user selected.

          The immutable entry branch is: {{entry_paths.branch_name}}

          The user should have indicated their choice (MERGE, PR, KEEP, or DISCARD)
          before approving the previous stage.

          Look for keywords in the recent context:
          - "merge" or "MERGE" -> MERGE option
          - "pr" or "PR" or "pull request" -> PR option
          - "keep" or "KEEP" -> KEEP option
          - "discard" or "DISCARD" or "abandon" -> DISCARD option

          If unclear, default to KEEP (safest option).

          Also verify:
          - Verification results: {{verification_results}}
          - If user chose MERGE but verification failed, report that MERGE is blocked
            and suggest PR or fixing issues first.

          Return:
          - selected_option: MERGE | PR | KEEP | DISCARD
          - option_valid: true | false (false if MERGE selected but verification failed)
          - reason: explanation if option is invalid
        output: "user_choice"

      - id: "execute-merge"
        agent: "foundation:git-ops"
        model_role: "fast"
        condition: "{{user_choice.selected_option}} == 'MERGE' and {{user_choice.option_valid}} == 'true'"
        prompt: |
          Execute MERGE: Fast-forward merge to main.

          Immutable entry paths:
          - Worktree: {{entry_paths.worktree_path}}
          - Branch: {{entry_paths.branch_name}}
          - Main repository: {{entry_paths.main_repo_path}}
          Branch info: {{branch_info}}

          Steps:
          1. Start in the captured main repository:
             cd "{{entry_paths.main_repo_path}}"
          2. Fetch latest from origin
          3. Switch to main: git checkout main
          4. Pull latest main: git pull origin main
          5. Merge the captured feature branch:
             git merge --ff-only "{{entry_paths.branch_name}}"
             (Use --ff-only to ensure clean fast-forward)
          6. Push to origin: git push origin main
          7. Before deleting the branch, remove the captured worktree from the
             captured main repository:
             cd "{{entry_paths.main_repo_path}}"
             git worktree remove "{{entry_paths.worktree_path}}"
          8. Delete the feature branch locally:
             git branch -d "{{entry_paths.branch_name}}"
          9. Delete remote branch if it exists:
             git push origin --delete "{{entry_paths.branch_name}}"

          Never recompute the worktree path after checkout or removal.

          Report:
          - Merge successful: yes/no
          - Main branch updated: yes/no
          - Feature branch deleted: yes/no
          - Any issues encountered

          Set needs_worktree_cleanup: false (already handled)
        output: "execution_result"

      - id: "execute-pr"
        agent: "foundation:git-ops"
        model_role: "fast"
        condition: "{{user_choice.selected_option}} == 'PR'"
        prompt: |
          Execute PR: Create a pull request.

          Immutable entry paths:
          - Worktree: {{entry_paths.worktree_path}}
          - Branch: {{entry_paths.branch_name}}
          - Main repository: {{entry_paths.main_repo_path}}
          Branch info: {{branch_info}}
          Change summary: {{change_summary}}

          Steps:
          1. Work from the captured feature worktree:
             cd "{{entry_paths.worktree_path}}"
          2. Ensure branch is pushed to origin:
             git push -u origin "{{entry_paths.branch_name}}"

          3. Create PR using GitHub CLI:
             gh pr create --title "{{entry_paths.branch_name}}" --body "<PR description>"

             PR Description should include:
             - The change summary from {{change_summary}}
             - Verification status from {{verification_results}}
             - Any relevant notes

          4. Report the PR URL

          If gh CLI is not available, provide the manual instructions.

          Set needs_worktree_cleanup: false
        output: "execution_result"

      - id: "execute-keep"
        agent: "foundation:git-ops"
        model_role: "fast"
        condition: "{{user_choice.selected_option}} == 'KEEP'"
        prompt: |
          Execute KEEP: Leave branch as-is.

          Immutable entry paths:
          - Worktree: {{entry_paths.worktree_path}}
          - Branch: {{entry_paths.branch_name}}
          - Main repository: {{entry_paths.main_repo_path}}
          Branch info: {{branch_info}}

          Simply report the current status:
          - Branch name: {{entry_paths.branch_name}}
          - Worktree location: {{entry_paths.worktree_path}}
          - Commits ahead of main: [count]
          - Verification status: [from verification_results]

          Provide helpful commands for later:
          - To resume work: cd "{{entry_paths.worktree_path}}"
          - To finish later: Execute kenergy:recipes/finish-branch.yaml
          - To check status: git status

          Set needs_worktree_cleanup: false
        output: "execution_result"

      - id: "execute-discard"
        agent: "foundation:git-ops"
        model_role: "fast"
        condition: "{{user_choice.selected_option}} == 'DISCARD'"
        prompt: |
          Execute DISCARD: Delete branch and worktree.

          Immutable entry paths:
          - Worktree: {{entry_paths.worktree_path}}
          - Branch: {{entry_paths.branch_name}}
          - Main repository: {{entry_paths.main_repo_path}}
          Branch info: {{branch_info}}

          WARNING: This is destructive! Confirm the branch name before proceeding.

          Steps:
          1. Switch out of the worktree by entering the captured main repository:
             cd "{{entry_paths.main_repo_path}}"
          2. Remove the captured worktree:
             git worktree remove "{{entry_paths.worktree_path}}" --force
          3. Delete the local branch:
             git branch -D "{{entry_paths.branch_name}}"
          4. Delete remote branch if pushed:
             git push origin --delete "{{entry_paths.branch_name}}"

          Never recompute the worktree path after checkout or removal.

          Set needs_worktree_cleanup: false (already handled)
        output: "execution_result"

      - id: "handle-blocked-merge"
        agent: "foundation:git-ops"
        model_role: "fast"
        condition: "{{user_choice.selected_option}} == 'MERGE' and {{user_choice.option_valid}} == 'false'"
        prompt: |
          Handle blocked MERGE request.

          The immutable entry branch is: {{entry_paths.branch_name}}
          User chose MERGE but it's not valid because: {{user_choice.reason}}
          Verification results: {{verification_results}}

          Provide clear guidance:

          ## MERGE Blocked

          You selected MERGE, but this option is currently unavailable.

          **Reason:** [explain why - usually verification failures]

          ### What Failed
          [List the failing checks from verification_results]

          ### Options
          1. **Fix the issues** and run this workflow again
          2. **Create a PR instead** to get review feedback
          3. **Keep the branch** and fix issues later

          To re-run after fixing:
          ```
          Execute kenergy:recipes/finish-branch.yaml
          ```

          Set needs_worktree_cleanup: false
        output: "execution_result"

  # ============================================================================
  # STAGE 4: Cleanup
  # ============================================================================
  - name: "cleanup"
    steps:
      - id: "cleanup-worktree"
        agent: "foundation:git-ops"
        model_role: "fast"
        prompt: |
          Perform cleanup if needed.

          Immutable entry paths:
          - Worktree: {{entry_paths.worktree_path}}
          - Branch: {{entry_paths.branch_name}}
          - Main repository: {{entry_paths.main_repo_path}}
          Execution result: {{execution_result}}
          Branch info: {{branch_info}}
          User choice: {{user_choice}}

          Check if worktree cleanup is needed:
          - If MERGE was executed successfully -> Worktree was already removed
          - If DISCARD was executed -> Worktree already removed
          - If PR or KEEP -> No cleanup needed

          If execution_result explicitly requests cleanup:
          1. Enter the captured main repository:
             cd "{{entry_paths.main_repo_path}}"
          2. Remove the captured worktree:
             git worktree remove "{{entry_paths.worktree_path}}"
          3. Verify removal: git worktree list

          Never recompute the worktree path after checkout or removal.

          Report what was cleaned up (if anything).
        output: "cleanup_result"
        on_error: "continue"

      - id: "final-summary"
        agent: "foundation:zen-architect"
        model_role: "reasoning"
        mode: "ANALYZE"
        prompt: |
          Generate final summary of what was done.

          Immutable entry paths:
          - Worktree: {{entry_paths.worktree_path}}
          - Branch: {{entry_paths.branch_name}}
          - Main repository: {{entry_paths.main_repo_path}}
          User choice: {{user_choice}}
          Execution result: {{execution_result}}
          Cleanup result: {{cleanup_result}}
          Branch info: {{branch_info}}

          Create a clear completion summary:

          ======================================================================
          BRANCH COMPLETION SUMMARY
          ======================================================================

          ## Action Taken
          [MERGE | PR | KEEP | DISCARD]

          ## Results
          [What happened based on execution_result]

          ## Current State
          - Branch: [exists/deleted]
          - Worktree: [exists/removed]
          - Main branch: [updated/unchanged]

          ## Next Steps
          [Relevant next steps based on the action taken]

          ======================================================================
        output: "final_summary"
        on_error: "continue"
