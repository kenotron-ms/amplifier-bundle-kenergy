# Validate Implementation Against Plan
# A lightweight, single-pass validation recipe for work completed outside this
# workflow. It supplies every task reviewer with one precomputed read-only
# branch-range packet and does not dispatch fixes.
#
# Workflow:
#   1. Parse the plan with complete task goals and risk-scaled review roles.
#   2. Build one read-only packet for the externally completed branch range.
#   3. Review each task once on spec/goal, quality, and verification axes.
#   4. Summarize the merged verdicts for a human decision.
#
# Usage:
#   amplifier run "execute kenergy:recipes/validate-implementation.yaml with plan_path=docs/implementation-plan.md"

name: "validate-implementation"
description: "Single-pass validation of externally-completed work with merged three-axis task reviews"
version: "2.0.0"
author: "Kenergy Bundle"
tags: ["validation", "review", "single-pass", "merged-review", "spec-compliance", "vdd"]

context:
  plan_path: ""  # Required: Path to the implementation plan file

stages:
  # ============================================================================
  # STAGE 1: Single-Pass Validation
  # ============================================================================
  - name: "validation"
    steps:
      # -----------------------------------------------------------------------
      # Step 1: Load and Parse the Implementation Plan
      # -----------------------------------------------------------------------
      - id: "load-plan"
        agent: "kenergy:plan-writer"
        model_role: "fast"
        prompt: |
          Load the implementation plan from: {{plan_path}}

          Parse the plan and extract all implementation tasks as a structured list.

          For each task, extract:
          - task_id: Unique identifier or name
          - description: What needs to be implemented
          - goal: The intended outcome of the task
          - spec: The detailed specification/requirements
          - acceptance_criteria: How to verify the task is complete
          - interfaces: Exact Consumes and Produces interfaces for this task
          - files: Files likely to be created or modified
          - dependencies: Any tasks this depends on (if applicable)
          - review_model_role: The risk-scaled review role for this task

          Select review_model_role by engineering judgment:
          - "fast" for a low-risk, mechanical diff.
          - "critique" for ordinary integration or correctness risk.
          - "reasoning" for architecture-sensitive or complex review.

          Return the result as a JSON object with this exact structure:
          {"tasks": [<array of task objects>], "total_tasks": <number>}

          Each task object in the array must have these keys:
          - "task_id": string
          - "description": string
          - "goal": string
          - "spec": string (the detailed specification)
          - "acceptance_criteria": string
          - "interfaces": string with exact Consumes and Produces interfaces
          - "files": array of file paths
          - "dependencies": array of task_ids (empty array if none)
          - "review_model_role": "fast", "critique", or "reasoning"

          The "tasks" key MUST contain the ordered array. Order by dependencies
          (independent first). Preserve ALL goal and specification details: they
          are mandatory review input.
        output: "plan_data"
        parse_json: true
        retry:
          max_attempts: 2
          backoff: exponential
          initial_delay: 5
          max_delay: 60

      # -----------------------------------------------------------------------
      # Step 2: Validate mandatory goals and review-role routing fail-closed
      # -----------------------------------------------------------------------
      - id: "validate-plan-data"
        type: "bash"
        timeout: 30
        command: |
          set -eu
          python3 - <<'PYEOF'
          import json
          import os

          raw = os.environ.get("PLAN_DATA", "null")
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as error:
              raise SystemExit(f"BLOCKED: plan_data is not valid JSON: {error}") from error

          if not isinstance(data, dict) or not isinstance(data.get("tasks"), list):
              raise SystemExit("BLOCKED: plan_data must contain a tasks array")
          if not data["tasks"]:
              raise SystemExit("BLOCKED: plan_data.tasks is empty")

          review_roles = {"fast", "critique", "reasoning"}
          for index, task in enumerate(data["tasks"]):
              if not isinstance(task, dict):
                  raise SystemExit(
                      f"BLOCKED: plan_data.tasks[{index}] must be an object"
                  )
              goal = task.get("goal")
              if not isinstance(goal, str) or not goal.strip():
                  raise SystemExit(
                      f"BLOCKED: plan_data.tasks[{index}] goal must be a non-empty string"
                  )
              role = task.get("review_model_role")
              if role not in review_roles:
                  raise SystemExit(
                      f"BLOCKED: plan_data.tasks[{index}] has invalid "
                      f"review_model_role: {role!r}"
                  )

          print(f"plan_data validated: {len(data['tasks'])} task(s) ready for review")
          PYEOF
        env:
          PLAN_DATA: "{{plan_data}}"

      # -----------------------------------------------------------------------
      # Step 3: Build One Read-Only Packet for the Externally Completed Range
      # -----------------------------------------------------------------------
      - id: "build-review-package"
        type: "bash"
        timeout: 30
        command: |
          set -eu

          if git symbolic-ref --quiet --short refs/remotes/origin/HEAD >/dev/null 2>&1; then
            BASE_REF="$(git symbolic-ref --quiet --short refs/remotes/origin/HEAD)"
          elif git rev-parse --verify --quiet origin/main >/dev/null 2>&1; then
            BASE_REF="origin/main"
          elif git rev-parse --verify --quiet main >/dev/null 2>&1; then
            BASE_REF="main"
          elif git rev-parse --verify --quiet origin/master >/dev/null 2>&1; then
            BASE_REF="origin/master"
          elif git rev-parse --verify --quiet master >/dev/null 2>&1; then
            BASE_REF="master"
          else
            BASE_REF="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          BASE_SHA="$(git merge-base "$BASE_REF" HEAD 2>/dev/null || git rev-parse "$BASE_REF")"
          HEAD_SHA="$(git rev-parse HEAD)"

          {
            printf '# Review Package\n\n'
            printf 'Plan: %s\n' "$PLAN_PATH"
            printf 'Range Base: %s (%s)\nRange Head: %s\n\n' "$BASE_SHA" "$BASE_REF" "$HEAD_SHA"
            printf '## Diff Stat\n\n```text\n'
            git diff --stat "$BASE_SHA..$HEAD_SHA"
            printf '```\n\n## Commits\n\n```text\n'
            git log --oneline "$BASE_SHA..$HEAD_SHA"
            printf '```\n\n## Diff\n\n```diff\n'
            git diff "$BASE_SHA..$HEAD_SHA" --
            printf '```\n\n## Working Tree Status\n\n```text\n'
            git status --short
            printf '```\n\n## Uncommitted Diff\n\n```diff\n'
            git diff --cached --
            git diff --
            printf '```\n'
          }
        env:
          PLAN_PATH: "{{plan_path}}"
        output: "review_package"

      # -----------------------------------------------------------------------
      # Step 4: Per-Task Merged Review (Single Pass, No Fix Loop)
      # -----------------------------------------------------------------------
      - id: "per-task-validation"
        foreach: "{{plan_data.tasks}}"
        as: "current_task"
        parallel: false
        steps:
          - id: "review-fast"
            condition: "{{current_task.review_model_role}} == 'fast'"
            agent: "kenergy:reviewer"
            model_role: "fast"
            prompt: &review_prompt |
              TASK GOAL
              =========
              Task ID: {{current_task.task_id}}
              Goal: {{current_task.goal}}
              Description: {{current_task.description}}
              Specification: {{current_task.spec}}
              Acceptance Criteria: {{current_task.acceptance_criteria}}
              Interfaces: {{current_task.interfaces}}
              Files: {{current_task.files}}

              REVIEW PACKAGE
              ==============
              {{review_package}}

              This is a single-pass validation of externally completed work.
              Review the supplied task goal and package on all three axes. Do not
              implement fixes, request a retry, or reconstruct the Git packet.
            output: "review_verdict"
            timeout: 600
            retry:
              max_attempts: 2
              backoff: exponential
              initial_delay: 5
              max_delay: 60

          - id: "review-critique"
            condition: "{{current_task.review_model_role}} == 'critique'"
            agent: "kenergy:reviewer"
            model_role: "critique"
            prompt: *review_prompt
            output: "review_verdict"
            timeout: 600
            retry:
              max_attempts: 2
              backoff: exponential
              initial_delay: 5
              max_delay: 60

          - id: "review-reasoning"
            condition: "{{current_task.review_model_role}} == 'reasoning'"
            agent: "kenergy:reviewer"
            model_role: "reasoning"
            prompt: *review_prompt
            output: "review_verdict"
            timeout: 600
            retry:
              max_attempts: 2
              backoff: exponential
              initial_delay: 5
              max_delay: 60

        collect: "validation_results"

      # -----------------------------------------------------------------------
      # Step 5: Summarize the Merged Three-Axis Verdicts
      # -----------------------------------------------------------------------
      - id: "validation-summary"
        agent: "kenergy:plan-writer"
        model_role: "fast"
        prompt: |
          VALIDATION SUMMARY
          ==================
          Compile a factual single-pass validation report for all tasks.

          VALIDATION RESULTS (one merged reviewer verdict per task):
          {{validation_results}}

          ORIGINAL PLAN DATA:
          {{plan_data}}

          For EACH task, summarize the reviewer's three required axes exactly:
          - **Spec/Goal Compliance**: PASS or FAIL, including any cited goal clause
            or file:line finding.
          - **Quality**: PASS or FAIL, including any cited command or file:line finding.
          - **Verification Adequacy**: PASS or FAIL, including the evidence pointer
            and the named break that proves the check is falsifiable.
          - **Overall Review**: PASS or FAIL, with load-bearing and advisory findings.
          - **Files Reviewed**: the task's declared files.

          Then provide totals for validated tasks, overall passes, and tasks needing
          attention. This is a factual validation report for a human decision: do
          not recommend or implement code changes.
        output: "validation_report"
        retry:
          max_attempts: 2
          backoff: exponential
          initial_delay: 5
          max_delay: 60

  # ============================================================================
  # STAGE 2: Human Review
  # ============================================================================
  - name: "review"
    steps:
      - id: "present-results"
        agent: "kenergy:plan-writer"
        model_role: "fast"
        prompt: |
          VALIDATION RESULTS — HUMAN REVIEW
          ===================================

          Present the full validation report for human review.

          VALIDATION REPORT:
          {{validation_report}}

          VALIDATION DETAILS (per task):
          {{validation_results}}

          Format the presentation as:

          ## Validation Summary
          - **Total tasks validated**: [count]
          - **Passed all three axes**: [count]
          - **Need attention**: [count]

          ## Per-Task Results
          For each task, show the merged review's Spec/Goal Compliance, Quality,
          and Verification Adequacy verdicts with any findings.

          ## Next Steps
          - If all tasks passed: implementation is validated, ready to proceed.
          - If tasks need attention: list their specific findings for the human to
            decide whether to address through the normal execution workflow.

          Keep the presentation factual and actionable. Do not prescribe fixes.
        output: "final_output"
        retry:
          max_attempts: 2
          backoff: exponential
          initial_delay: 5
          max_delay: 60

    approval:
      required: true
      prompt: |
        ======================================================================
        VALIDATION COMPLETE — HUMAN REVIEW REQUIRED
        ======================================================================

        All tasks from the implementation plan received one merged review covering
        spec/goal compliance, quality, and verification adequacy.

        Review the validation results above.

        OPTIONS:
        - APPROVE: Accept the validation report.
        - DENY: Address the cited findings through the normal execution workflow.

        ======================================================================
      timeout: 0
      default: "deny"
