# Kenergy Full Development Cycle
# End-to-end workflow from idea to merged code
#
# Usage:
#   amplifier run "execute kenergy:recipes/kenergy-full-development-cycle.yaml with feature_name='my-feature'"
#   amplifier run "execute kenergy:recipes/kenergy-full-development-cycle.yaml with feature_name='my-feature' topic='description of feature'"
#
# This meta-recipe composes the Kenergy development path:
#   design -> planning -> continuous subagent-driven execution -> holistic review -> finish
#
# Approval Gates (2):
#   1. After design - approve before planning
#   2. After branch review - choose finish action (merge/PR/keep/discard)

name: "kenergy-full-development-cycle"
description: "Complete development workflow with design and finish checkpoints around continuous VDD execution"
version: "2.0.1"
author: "Kenergy Bundle"
tags: ["workflow", "development", "vdd", "full-cycle", "continuous-execution", "holistic-review"]

context:
  feature_name: ""      # Required: name for branch and files (e.g., "user-authentication")
  topic: ""             # Optional: initial idea description for brainstorming
  project_path: "."     # Project directory (defaults to current)
  _approval_message: "" # Populated by engine when user approves with a message (e.g., "merge", "pr")

stages:
  # ==========================================================================
  # STAGE 1: Design
  # Refine the idea into a complete design document
  # ==========================================================================
  - name: "design"
    steps:
      # Derive file paths from feature_name
      - id: "setup-paths"
        type: "bash"
        command: |
          DATE=$(date +%Y-%m-%d)
          FEATURE_SLUG=$(echo "{{feature_name}}" | tr ' ' '-' | tr '[:upper:]' '[:lower:]')
          echo "{\"design_path\": \"docs/plans/${DATE}-${FEATURE_SLUG}-design.md\", \"plan_path\": \"docs/plans/${DATE}-${FEATURE_SLUG}-plan.md\", \"branch_name\": \"feature/${FEATURE_SLUG}\", \"feature_slug\": \"${FEATURE_SLUG}\"}"
        parse_json: true
        output: "paths"
        timeout: 30

      # Ensure docs/plans directory exists
      - id: "ensure-dirs"
        type: "bash"
        command: |
          set -e
          mkdir -p "{{project_path}}/docs/plans"
          echo "Created docs/plans directory"
        timeout: 30

      # Understand project context
      - id: "understand-context"
        agent: "kenergy:design-writer"
        model_role: "fast"
        prompt: |
          Understand the project context for designing: {{feature_name}}
          
          Project path: {{project_path}}
          Topic: {{topic}}
          
          Briefly survey:
          1. Project structure and tech stack
          2. Existing patterns and conventions
          3. Any relevant existing code
          
          Provide a concise summary (2-3 paragraphs) to inform the design.
        output: "project_context"

      # Explore requirements through questions
      - id: "explore-requirements"
        agent: "kenergy:design-writer"
        model_role: "reasoning"
        prompt: |
          Based on the project context:
          {{project_context}}
          
          Feature: {{feature_name}}
          Initial description: {{topic}}
          
          Ask 3-5 clarifying questions to fully understand:
          - What problem does this solve?
          - What are the key requirements?
          - What are the constraints?
          - What does success look like?
          - How will we verify it works (curl, browser, script, tests)?
          
          Then answer them yourself based on reasonable assumptions and the project context.
          Document both the questions and your answers.
        output: "requirements"

      # Design the solution
      - id: "create-design"
        agent: "kenergy:design-writer"
        model_role: "reasoning"
        prompt: |
          Create a design document for: {{feature_name}}
          
          Requirements:
          {{requirements}}
          
          Project context:
          {{project_context}}
          
          Create a complete design document with:
          1. Overview - what we're building and why
          2. Requirements - functional and non-functional
          3. Design - architecture, components, interfaces
          4. Implementation approach - high-level strategy
          5. Verification approach - how we'll prove it works (VDD hierarchy)
          6. Open questions - anything needing clarification
          
          Format as clean markdown suitable for saving to a file.
        output: "design_content"

      # Save design document
      - id: "save-design"
        type: "bash"
        command: |
          cat > "{{project_path}}/{{paths.design_path}}" << 'DESIGN_EOF'
          {{design_content}}
          DESIGN_EOF
          echo "Saved design to {{paths.design_path}}"
        output: "save_design_result"
        timeout: 60

      # Present design for approval
      - id: "present-design"
        agent: "kenergy:design-writer"
        model_role: "fast"
        prompt: |
          Present the design for approval.
          
          Design saved to: {{paths.design_path}}
          
          Summarize:
          1. What we're building (1-2 sentences)
          2. Key design decisions (bullet points)
          3. Verification approach (how we'll prove it works)
          4. Implementation complexity estimate
          5. Any risks or concerns
          
          This summary helps the human decide whether to approve.
        output: "design_summary"

    # APPROVAL GATE 1: Approve design before planning
    approval:
      prompt: |
        ## Design Review
        
        {{design_summary}}
        
        Design document: {{paths.design_path}}
        
        **APPROVE** to proceed to planning phase.
        **DENY** to revise the design.

  # ==========================================================================
  # STAGE 2: Planning
  # Create detailed VDD implementation plan
  # ==========================================================================
  - name: "planning"
    steps:
      # Read the approved design
      - id: "load-design"
        type: "bash"
        command: |
          cat "{{project_path}}/{{paths.design_path}}"
        output: "design_doc"
        timeout: 30

      # Create implementation plan
      - id: "create-plan"
        agent: "kenergy:plan-writer"
        model_role: "reasoning"
        prompt: |
          Create a detailed VDD implementation plan for: {{feature_name}}
          
          Design document:
          {{design_doc}}
          
          Create a plan with bite-sized tasks. Each task should:
          - Be completable in one focused session (2-5 minutes)
          - Have clear success criteria
          - Specify its verification method explicitly (VDD hierarchy)
          - Be independently verifiable
          
          VDD hierarchy — pick the cheapest that genuinely proves the claim:
          1. Static analysis (ruff/ty/tsc) — always free
          2. Run the code directly — scripts, CLIs
          3. curl/HTTP call against running server — endpoints
          4. Browser via playwright-cli — UI changes
          5. DTU/Reality Check — true isolation
          
          Format as markdown with:
          > **For execution:** Use `/build-like-ken` mode.

          **Goal:** [Brief summary]
          **Verification approach:** [End-to-end verification strategy]
          
          ## Tasks
          ### Task 1: [Name]
          **Files:** [files to create/modify]
          **Implementation** [complete code]
          **Static Analysis** [command]
          **Verification** [exact command and expected output]
          **Commit** [git add ... && git commit -m "..."]
          
          ### Task 2: [Name]
          ...
          
          ## Dependencies
          Note any task dependencies or required order
        output: "plan_content"

      # Save plan document
      - id: "save-plan"
        type: "bash"
        command: |
          cat > "{{project_path}}/{{paths.plan_path}}" << 'PLAN_EOF'
          {{plan_content}}
          PLAN_EOF
          echo "Saved plan to {{paths.plan_path}}"
        output: "save_plan_result"
        timeout: 60

  # ==========================================================================
  # STAGE 3: Implementation
  # Create a worktree and execute the plan continuously with VDD
  # ==========================================================================
  - name: "implementation"
    steps:
      # Create git worktree for isolated development
      - id: "create-worktree"
        agent: "foundation:git-ops"
        model_role: "fast"
        prompt: |
          Create a git worktree for feature development.
          
          Branch name: {{paths.branch_name}}
          Project path: {{project_path}}
          
          Steps:
          1. Verify we're in a git repository
          2. Check that .gitignore includes .worktrees/ 
          3. Create worktree: git worktree add .worktrees/{{paths.feature_slug}} -b {{paths.branch_name}}
          4. Verify the worktree was created
          5. Run static analysis in worktree to establish clean baseline
          
          Report the full worktree path and branch name.

      # Copy the approved plan into the worktree and resolve one execution target
      - id: "prepare-execution-target"
        type: "bash"
        command: |
          set -eu
          python3 - <<'PYEOF'
          import json
          import os
          import shutil
          from pathlib import Path

          project = Path(os.environ["PROJECT_PATH"]).expanduser().resolve()
          worktree = (project / ".worktrees" / os.environ["FEATURE_SLUG"]).resolve()
          source_plan = (project / os.environ["PLAN_PATH"]).resolve()
          target_plan = (worktree / os.environ["PLAN_PATH"]).resolve()

          if not worktree.is_dir():
              raise SystemExit(f"BLOCKED: worktree not found: {worktree}")
          if not source_plan.is_file():
              raise SystemExit(f"BLOCKED: implementation plan not found: {source_plan}")
          try:
              target_plan.relative_to(worktree)
          except ValueError:
              raise SystemExit(
                  f"BLOCKED: target plan {target_plan} is not inside worktree {worktree}"
              )

          target_plan.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source_plan, target_plan)
          copied_plan = target_plan.resolve()
          try:
              copied_plan.relative_to(worktree)
          except ValueError:
              raise SystemExit(
                  f"BLOCKED: copied plan {copied_plan} is not inside worktree {worktree}"
              )
          print(json.dumps({"path": str(worktree), "plan_path": os.environ["PLAN_PATH"]}))
          PYEOF
        env:
          PROJECT_PATH: "{{project_path}}"
          FEATURE_SLUG: "{{paths.feature_slug}}"
          PLAN_PATH: "{{paths.plan_path}}"
        parse_json: true
        output: "execution_target"
        timeout: 30

      # Read the plan from the same worktree used for implementation and review
      - id: "load-plan"
        type: "bash"
        cwd: "{{execution_target.path}}"
        command: |
          cat "{{execution_target.plan_path}}"
        output: "plan_doc"
        timeout: 30

      # Execute the plan continuously using the SDD recipe
      - id: "execute-plan"
        type: "recipe"
        recipe: "subagent-driven-development.yaml"
        context:
          plan_path: "{{execution_target.plan_path}}"
          worktree_path: "{{execution_target.path}}"
        output: "implementation_result"

      # Require the sub-recipe's explicit success contract before review or finish
      - id: "require-execution-complete"
        type: "bash"
        cwd: "{{execution_target.path}}"
        command: |
          set -eu
          python3 - <<'PYEOF'
          import os

          lines = os.environ.get("COMPLETION_REPORT", "").splitlines()
          if not lines or lines[0] != "STATUS: ALL_TASKS_COMPLETE":
              raise SystemExit(
                  "BLOCKED: SDD did not return STATUS: ALL_TASKS_COMPLETE"
              )
          if len(lines) != 2 or not lines[1].startswith("LEDGER: "):
              raise SystemExit("BLOCKED: SDD completion report is malformed")
          print("SDD completion status validated.")
          PYEOF
        env:
          COMPLETION_REPORT: "{{implementation_result.completion_report}}"
        timeout: 30

      # Review the complete branch after continuous task execution
      - id: "review-branch"
        agent: "kenergy:code-reviewer"
        model_role: "critique"
        prompt: |
          Perform a holistic branch review after continuous plan execution.

          Worktree: {{execution_target.path}}
          Plan: {{plan_doc}}
          Continuous execution result: {{implementation_result.completion_report}}

          Review the entire changeset in the worktree, not individual task
          reviews. Assess cross-task integration, architectural consistency,
          production readiness, plan alignment, and verification coverage.
          Use the code-reviewer's output contract and do not modify files,
          commit, push, merge, open a PR, or deploy.
        output: "branch_review"

      # Present implementation for approval
      - id: "present-implementation"
        type: "bash"
        cwd: "{{execution_target.path}}"
        command: |
          echo "=== Implementation Summary ===" && \
          echo "Branch: {{paths.branch_name}}" && \
          echo "Worktree: {{execution_target.path}}" && \
          echo "" && \
          echo "=== Changes ===" && \
          git diff --stat main 2>/dev/null || git diff --stat HEAD~5 2>/dev/null || echo "Unable to show diff" && \
          echo "" && \
          echo "=== Verification Status ===" && \
          (python -m pytest --tb=no -q 2>/dev/null || echo "Run verification commands from plan manually to confirm")
        output: "implementation_summary"
        timeout: 120
        on_error: "continue"

    # APPROVAL GATE 2: Choose finish action
    approval:
      prompt: |
        ## Implementation Complete
        
        {{implementation_summary}}
        
        Holistic branch review: {{branch_review}}
        
        Choose how to finish:
        - **APPROVE** with message "merge" - Merge to main and cleanup
        - **APPROVE** with message "pr" - Create pull request
        - **APPROVE** with message "keep" - Keep branch for later
        - **DENY** with reason - Stop and address issues

  # ==========================================================================
  # STAGE 4: Finish
  # Execute chosen action and cleanup
  # ==========================================================================
  - name: "finish"
    steps:
      # Parse the approval message for action
      - id: "determine-action"
        type: "bash"
        command: |
          set -e
          ACTION="{{_approval_message}}"
          if [ -z "$ACTION" ]; then
            ACTION="pr"
          fi
          echo "{\"action\": \"${ACTION}\"}"
        parse_json: true
        output: "finish_action"
        timeout: 30

      # Execute the finish action
      - id: "execute-finish"
        agent: "foundation:git-ops"
        model_role: "fast"
        prompt: |
          Finish the development branch.
          
          Action: {{finish_action.action}}
          Branch: {{paths.branch_name}}
          Worktree: {{execution_target.path}}
          Feature: {{feature_name}}
          
          Based on the action:
          
          If "merge":
          1. Ensure static analysis and tests pass
          2. Merge branch to main: git checkout main && git merge {{paths.branch_name}}
          3. Delete the branch: git branch -d {{paths.branch_name}}
          4. Remove worktree: git worktree remove .worktrees/{{paths.feature_slug}}
          
          If "pr":
          1. Push branch: git push -u origin {{paths.branch_name}}
          2. Create PR using gh cli: gh pr create --title "{{feature_name}}" --body "Implementation of {{feature_name}} following VDD"
          3. Report PR URL
          4. Keep worktree for potential revisions
          
          If "keep":
          1. Just report that branch and worktree are preserved
          2. Provide instructions for resuming later
          
          Report what was done.
        output: "finish_result"

      # Final summary
      - id: "final-summary"
        type: "bash"
        command: |
          echo "============================================"
          echo "  KENERGY DEVELOPMENT CYCLE COMPLETE"
          echo "============================================"
          echo ""
          echo "Feature: {{feature_name}}"
          echo "Action: {{finish_action.action}}"
          echo ""
          echo "Artifacts:"
          echo "  Design: {{paths.design_path}}"
          echo "  Plan: {{paths.plan_path}}"
          echo ""
          echo "{{finish_result}}"
          echo ""
          echo "============================================"
        output: "final_output"
        timeout: 30
        on_error: "continue"
