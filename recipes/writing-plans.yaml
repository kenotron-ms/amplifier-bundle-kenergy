# Writing Plans Workflow
# Creates detailed VDD implementation plans from design documents
#
# Usage:
#   amplifier run "execute kenergy:recipes/writing-plans.yaml with design_path=docs/designs/my-feature.md"
#
# This recipe:
#   1. Reads and analyzes a design document
#   2. Breaks it down into implementable tasks with VDD verification methods
#   3. Creates a detailed plan
#   4. Saves the plan to docs/plans/
#   5. Executes the plan continuously

name: "writing-plans"
description: "Create, save, and immediately execute detailed VDD implementation plans with bite-sized tasks (2-5 min each)"
version: "1.0.3"
author: "Kenergy Bundle"
tags: ["planning", "implementation", "vdd", "workflow"]

context:
  design_path: ""     # Required: path to design document
  feature_name: ""    # Optional: extracted from design if not provided
  worktree_path: "."  # Execution root; defaults to the current project checkout

stages:
  # ============================================================================
  # STAGE 1: Planning
  # ============================================================================
  - name: "planning"
    steps:
      - id: "load-design"
        agent: "kenergy:plan-writer"
        model_role: "reasoning"
        prompt: |
          Read and analyze the design document at: {{design_path}}

          Extract and provide:
          1. **Feature Name**: A kebab-case identifier for this feature
          2. **Goals**: What we're building and why
          3. **Architecture Decisions**: Key technical decisions made
          4. **Tech Stack**: Technologies, frameworks, and tools needed
          5. **Dependencies**: External services, libraries, or prerequisites
          6. **Global Constraints**: Every project-wide requirement copied exactly
             as written in the design/spec, including version floors, dependency
             limits, naming and copy rules, and platform requirements. Preserve
             exact values and distinguish these from task-local constraints.
          7. **Verification Approach**: How the design says we'll prove it works

          If a feature_name was provided ({{feature_name}}), use that. Otherwise, derive a suitable kebab-case name from the design.

          Format your response as a structured summary that can be used for implementation planning.
        output: "design_analysis"

      - id: "analyze-requirements"
        agent: "kenergy:plan-writer"
        model_role: "reasoning"
        prompt: |
          Based on this design analysis:
          {{design_analysis}}

          Break down the implementation into discrete, implementable tasks.

          For each task, identify:
          - **What**: Clear description of what needs to be done
          - **Files**: Exact file paths to create or modify
          - **Verification method**: How to prove this task works (the right level from VDD hierarchy)
          - **Dependencies**: Which tasks must complete first
          - **Interfaces**:
            - **Consumes**: Exact functions, types, files, configuration, or
              data contracts supplied by earlier tasks
            - **Produces**: Exact functions, types, files, configuration, or
              data contracts later tasks rely on
          - **Model-role recommendations**:
            - `implementation_model_role`: `fast`, `coding`, or `reasoning`
            - `review_model_role`: `fast`, `critique`, or `reasoning`
            - `escalated_model_role`: `coding`, `reasoning`, or `critical-ops`,
              strictly above the implementation role

          VDD verification hierarchy — choose the cheapest that genuinely proves the claim:
          1. Static analysis (ruff/ty/tsc) — always free
          2. Run the code directly — scripts, CLIs
          3. curl/HTTP call against running server — endpoints
          4. Browser via playwright-cli — UI changes
          5. DTU/Reality Check — true isolation

          Requirements:
          - Each task MUST be completable in 2-5 minutes
          - If a task is larger, break it into smaller sub-tasks
          - Group related tasks logically
          - Plans with more than 15 tasks MUST remain one plan document. Organize
            them under ordered `## Phase N: [Phase Name]` section headers for
            readability; do not create separate phase files or a phase manifest.
          - Order tasks by dependency
          - Every task MUST specify its verification method — no "test it manually"
          - Select model-role recommendations from the task's actual integration
            and design risk, not task duration or file count
        output: "task_breakdown"

      - id: "create-plan"
        agent: "kenergy:plan-writer"
        model_role: "reasoning"
        prompt: |
          Create a comprehensive VDD implementation plan based on:

          Design Analysis:
          {{design_analysis}}

          Task Breakdown:
          {{task_breakdown}}

          Generate a plan in this EXACT format:

          ---
          # Implementation Plan: [Feature Name]

          > **For execution:** This plan is executed immediately by the subagent-driven-development workflow.

          **Date**: [Today's date in YYYY-MM-DD format]
          **Design Source**: {{design_path}}

          **Goal:** [Clear 1-2 sentence statement of what we're building]
          **Architecture:** [Key architectural decisions and patterns being used]
          **Tech Stack:** [List of technologies, frameworks, libraries]
          **Verification approach:** [How the feature will be proven to work end-to-end]

          ## Global Constraints

          [The spec's project-wide requirements — version floors, dependency limits,
          naming and copy rules, platform requirements — one line each, with exact
          values copied verbatim from the spec. Every task's requirements implicitly
          include this section.]

          ---

          ## Tasks

          ### Task 1: [Task Name]

          **Description:** [Concise task summary]

          **Goal:** [Task-level outcome — the specific behavior this task must produce]

          **Specification:** [Precise behavioral requirements]

          **Acceptance Criteria:** [Observable completion criteria]

          **Files:**
          - Create: `exact/path/to/file.py`
          - Modify: `exact/path/to/existing.py:123-145`

          **Interfaces:**
          - Consumes: [what this task uses from earlier tasks — exact signatures]
          - Produces: [what later tasks rely on — exact function names, parameter
            and return types. A task's implementer sees only their own task; this
            block is how they learn the names and types neighboring tasks use.]

          **Model Roles:**
          - implementation_model_role: `coding`
          - review_model_role: `critique`
          - escalated_model_role: `reasoning`

          **Implementation**
          ```[language]
          // Complete, copy-pasteable implementation code
          // No placeholders or "..." - include EVERYTHING
          ```

          **Static Analysis** (always run first — fast and free)
          ```bash
          ruff check src/path/to/file.py
          ```
          Expected: no errors

          **Verification** (pick the right VDD level)
          [ONE of:]
          - `curl -X POST http://localhost:8000/endpoint -d '{}'` → Expected: `{"status": "ok"}`
          - `pytest tests/path/test_file.py -v` → Expected: PASS (library code only)
          - `playwright-cli open http://localhost:3000/feature` → Expected: [describe what you see]
          - `python -c "from module import fn; print(fn(input))"` → Expected: `output`

          **Commit**
          ```bash
          git add [files]
          git commit -m "feat: [what this does]"
          ```

          ---

          Repeat the task structure for every task.

          ---

          ## Summary

          - **Total Tasks**: [N]
          - **Estimated Time**: [X-Y] minutes
          - **Key Risks**: [Any risks or areas needing attention]

          ---

          CONTENT RULES (all omissions are errors):
          1. Assume the engineer has ZERO context about this codebase
          2. Every code block must be COMPLETE and copy-pasteable
          3. NO placeholders like "..." or "// add your code here"
          4. Each step is ONE atomic action (2-5 minutes max)
          5. Include exact file paths, not relative descriptions
          6. Verification commands must be exact and runnable
          7. Every task MUST have a verification method specified
          8. Do NOT default to "write a unit test" for non-library code
          9. Replace the Global Constraints explanatory text with the exact
             project-wide requirements from the design analysis; do not omit the
             `## Global Constraints` block.
          10. Before every task's `**Files:**` block, include non-empty
              `**Description:**`, `**Goal:**`, `**Specification:**`, and
              `**Acceptance Criteria:**` fields. They map directly to the
              executor's `description`, `goal`, `spec`, and
              `acceptance_criteria` task fields; omitting any is an error.
          11. Include the `**Interfaces:**` block after every task's Files block
              with concrete Consumes and Produces contracts.
          12. Include concrete `implementation_model_role`,
              `review_model_role`, and `escalated_model_role` values for every
              task. Select roles by engineering judgment based on integration and
              design risk, not task duration or file count.
          13. If the plan has more than 15 tasks, keep every task in this single
              plan document and organize them under ordered
              `## Phase N: [Phase Name]` section headers. Never create separate
              phase files or a phase manifest; the executor parses and runs every
              task from this one saved plan sequentially.

          RED FLAGS (correct before returning the plan):
          - Any task missing or leaving blank Description, Goal, Specification,
            or Acceptance Criteria fields.

          Generate the complete implementation plan now.
        output: "implementation_plan"

  # ============================================================================
  # STAGE 2: Save and Execute
  # ============================================================================
  - name: "save-and-execute"
    steps:
      - id: "extract-metadata"
        agent: "kenergy:plan-writer"
        model_role: "fast"
        prompt: |
          From this design analysis, extract the feature name:
          {{design_analysis}}

          If a feature_name was explicitly provided ({{feature_name}}), use that.
          Otherwise, extract the kebab-case feature name from the design analysis.

          Respond with ONLY the kebab-case feature name (e.g., "user-authentication").
          No explanation, no quotes, just the name.
        output: "extracted_feature_name"

      - id: "save-plan"
        agent: "kenergy:plan-writer"
        model_role: "fast"
        prompt: |
          Save the implementation plan to the filesystem under this execution root:
          {{worktree_path}}

          Plan content to save:
          {{implementation_plan}}

          Instructions:
          1. Create the directory `{{worktree_path}}/docs/plans/` if it doesn't exist
          2. Save the plan to:
             `{{worktree_path}}/docs/plans/YYYY-MM-DD-{{extracted_feature_name}}-plan.md`
             (Use today's date for YYYY-MM-DD)
          3. Use the filesystem tools to write the file
          4. Preserve the plan content exactly, including its Global Constraints,
             Interfaces, model-role blocks, and any organizational phase headings
          5. Save the complete plan as this one file; never split phase sections
             into separate plan files

          After saving, respond with ONLY the normalized repository-relative path
          string, for example:
          docs/plans/YYYY-MM-DD-{{extracted_feature_name}}-plan.md

          No explanation, no confirmation, no Markdown, no quotes, and no labels.
        output: "saved_plan_path"

      - id: "execute-plan"
        type: "recipe"
        recipe: "subagent-driven-development.yaml"
        context:
          plan_path: "{{saved_plan_path}}"
          worktree_path: "{{worktree_path}}"
        output: "execution_result"
