# Single Task Pipeline
# Per-task implementation pipeline extracted from subagent-driven-development.yaml
# to run one uniform implement -> packet review -> bounded fix -> ledger lifecycle.
#
# Context variables received from parent:
#   current_task: The task object with task_id, description, spec, roles, and interfaces.
#   plan_identity: Absolute path of the active implementation plan.
#   state_dir: Plan-scoped durable state directory.
#   ledger_path: Plan-scoped durable ledger.

name: "single-task-pipeline"
description: "Per-task implementation pipeline: implement, packet-review, bounded fixes, and safe ledger completion"
version: "1.0.0"
author: "Kenergy Bundle"
tags: ["implementation", "per-task", "pipeline", "vdd", "packet-review", "bounded-fix"]

context:
  current_task: {}
  plan_identity: ""
  state_dir: ""
  ledger_path: ""
  # Pipeline defaults keep every conditional path explicit and fail-closed.
  task_already_done: "false"
  task_implementation: ""
  original_implementer_session_id: ""
  implementation_report:
    status: "SKIP"
    session_id: ""
    session_id_valid: "false"
    blocker: "implementation report has not been parsed"
  review_verdict: ""
  review_package: ""
  review_evaluation:
    exact_pass: "false"
    no_load_bearing: "false"
    load_bearing_remaining: "true"
    advisory_findings: ""
    load_bearing_findings: ""
    unclassified_failure: "true"
  review_resolution:
    outcome: "PENDING"
    no_load_bearing: "false"
    terminal: "false"
    round: "0"
    advisory_findings: ""
    blocker: ""
  task_outcome: "ALREADY_COMPLETED"

steps:
  # --- 2.0a: Trust completion only when a safe ledger entry matches Git history ---
  - id: "check-task-complete"
    type: "bash"
    timeout: 30
    command: |
      set -eu
      python3 - <<'PYEOF'
      import os
      import re
      import subprocess
      from pathlib import Path

      ledger = Path(os.environ["LEDGER_PATH"]).expanduser()
      if not ledger.is_file():
          raise SystemExit(f"BLOCKED: ledger not found: {ledger}")

      expected_first_line = f"# Plan: {os.environ['PLAN_IDENTITY']}"
      lines = ledger.read_text(encoding="utf-8").splitlines()
      if not lines or lines[0] != expected_first_line:
          raise SystemExit(
              "BLOCKED: ledger identity mismatch; refusing cross-plan state"
          )

      task_id = os.environ["TASK_ID"].strip()
      safe_outcomes = {"PASS", "APPROVED_WITH_PARKED"}
      entry_pattern = re.compile(
          r"^- \[x\] (?P<task>.+?) — (?P<sha>[0-9a-f]{7,64}) — (?P<outcome>.+)$"
      )

      for line in lines:
          match = entry_pattern.match(line)
          if not match or match.group("task") != task_id:
              continue
          if match.group("outcome") not in safe_outcomes:
              continue
          if subprocess.run(
              ["git", "merge-base", "--is-ancestor", match.group("sha"), "HEAD"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              check=False,
          ).returncode == 0:
              print("true")
              break
      else:
          print("false")
      PYEOF
    env:
      TASK_ID: "{{current_task.task_id}}"
      PLAN_IDENTITY: "{{plan_identity}}"
      LEDGER_PATH: "{{ledger_path}}"
    output: "task_already_done"

  - id: "prepare-task-state"
    type: "bash"
    timeout: 30
    command: |
      set -eu
      python3 - <<'PYEOF'
      import json
      import os
      import re
      import subprocess
      from pathlib import Path

      task_id = os.environ["TASK_ID"].strip()
      slug = re.sub(r"[^a-z0-9]+", "-", task_id.lower()).strip("-")
      if not slug:
          raise SystemExit("BLOCKED: task ID produced an empty slug")

      state_dir = Path(os.environ["STATE_DIR"]).expanduser()
      brief_path = state_dir / "task-briefs" / f"{slug}.md"
      base_path = state_dir / "task-briefs" / f"{slug}.base-sha"
      brief = """# Task Brief: {task_id}

      ## Goal
      {description}

      ## Specification
      {specification}

      ## Acceptance Criteria
      {acceptance}

      ## Interfaces
      {interfaces}

      ## Files
      {files}
      """.format(
          task_id=task_id,
          description=os.environ["TASK_DESCRIPTION"],
          specification=os.environ["TASK_SPEC"],
          acceptance=os.environ["TASK_ACCEPTANCE"],
          interfaces=os.environ["TASK_INTERFACES"],
          files=os.environ["TASK_FILES"],
      )
      brief_path.write_text(brief, encoding="utf-8")
      if not base_path.exists():
          base_path.write_text(
              subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() + "\n",
              encoding="utf-8",
          )

      print(json.dumps({
          "task_slug": slug,
          "task_brief_path": str(brief_path),
          "task_base_sha_path": str(base_path),
      }))
      PYEOF
    env:
      TASK_ID: "{{current_task.task_id}}"
      TASK_DESCRIPTION: "{{current_task.description}}"
      TASK_SPEC: "{{current_task.spec}}"
      TASK_ACCEPTANCE: "{{current_task.acceptance_criteria}}"
      TASK_INTERFACES: "{{current_task.interfaces}}"
      TASK_FILES: "{{current_task.files}}"
      STATE_DIR: "{{state_dir}}"
    parse_json: true
    output: "task_state"

  - id: "load-plan-brief"
    type: "bash"
    timeout: 10
    command: |
      cat "{{ledger_path}}"
    output: "project_brief"

  # --- 2a: Implement exactly one task with an explicit implementation role ---
  - id: "implement-fast"
    condition: "{{task_already_done}} != 'true' and {{current_task.implementation_model_role}} == 'fast'"
    agent: "kenergy:implementer"
    model_role: "fast"
    prompt: &implementation_prompt |
      IMPLEMENT ONE TASK
      ==================

      TASK GOAL
      =========
      Task ID: {{current_task.task_id}}
      Description: {{current_task.description}}
      Specification: {{current_task.spec}}
      Acceptance Criteria: {{current_task.acceptance_criteria}}
      Interfaces: {{current_task.interfaces}}
      Files: {{current_task.files}}

      PLAN-SCOPED PROJECT BRIEF
      =========================
      {{project_brief}}

      Implement exactly this task and nothing else. Run the task's exact static
      analysis and VDD verification commands, record the actual output, and make
      one atomic commit. Do not substitute a string-presence check for behavioral
      proof. Do not push, merge, open a PR, or deploy.

      RESPONSE CONTRACT
      =================
      STATUS: DONE | DONE_WITH_CONCERNS | BLOCKED | NEEDS_CONTEXT
      SESSION_ID: Copy the full Session ID from your injected environment context.
      TASK_ID: {{current_task.task_id}}
      FILES_CHANGED: list exact paths
      STATIC_ANALYSIS: exact command and output
      VERIFICATION: exact command, expected result, and actual output
      COMMIT: full commit hash and subject
      CONCERNS: NONE or specific concerns
      BLOCKER: NONE or the exact blocker
    output: "task_implementation"
    timeout: 3600
    retry:
      max_attempts: 3
      backoff: exponential
      initial_delay: 5
      max_delay: 120

  - id: "implement-coding"
    condition: "{{task_already_done}} != 'true' and {{current_task.implementation_model_role}} == 'coding'"
    agent: "kenergy:implementer"
    model_role: "coding"
    prompt: *implementation_prompt
    output: "task_implementation"
    timeout: 3600
    retry:
      max_attempts: 3
      backoff: exponential
      initial_delay: 5
      max_delay: 120

  - id: "implement-reasoning"
    condition: "{{task_already_done}} != 'true' and {{current_task.implementation_model_role}} == 'reasoning'"
    agent: "kenergy:implementer"
    model_role: "reasoning"
    prompt: *implementation_prompt
    output: "task_implementation"
    timeout: 3600
    retry:
      max_attempts: 3
      backoff: exponential
      initial_delay: 5
      max_delay: 120

  # --- 2a.1: Parse the report fail-closed and retain the original child session ---
  - id: "extract-initial-implementation-report"
    condition: "{{task_already_done}} != 'true'"
    type: "bash"
    timeout: 30
    command: |
      set -eu
      python3 - <<'PYEOF'
      import json
      import os
      import re

      raw = os.environ.get("IMPLEMENTATION_OUTPUT", "")
      status_matches = re.findall(
          r"(?m)^STATUS:[ \t]*(DONE|DONE_WITH_CONCERNS|BLOCKED|NEEDS_CONTEXT)[ \t]*$",
          raw,
      )
      session_matches = re.findall(r"(?m)^SESSION_ID:[ \t]*([^\s]+)[ \t]*$", raw)
      session_id = session_matches[0] if len(session_matches) == 1 else ""
      session_id_valid = bool(
          re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{15,}", session_id)
      )

      blocker = ""
      if len(status_matches) != 1:
          status = "BLOCKED"
          blocker = "missing or ambiguous STATUS line in implementer response"
      else:
          status = status_matches[0]

      if not session_id_valid:
          status = "BLOCKED"
          blocker = "missing or invalid full SESSION_ID in implementer response"
      elif status not in {"DONE", "DONE_WITH_CONCERNS"}:
          blocker = "implementer did not report a completed task"

      print(json.dumps({
          "status": status,
          "session_id": session_id,
          "session_id_valid": "true" if session_id_valid else "false",
          "blocker": blocker,
      }))
      PYEOF
    env:
      IMPLEMENTATION_OUTPUT: "{{task_implementation}}"
    parse_json: true
    output: "implementation_report"

  - id: "save-original-implementer-session"
    condition: "{{task_already_done}} != 'true' and {{implementation_report.session_id_valid}} == 'true'"
    type: "bash"
    timeout: 10
    command: |
      set -eu
      test -n "$SESSION_ID"
      printf '%s\n' "$SESSION_ID"
    env:
      SESSION_ID: "{{implementation_report.session_id}}"
    output: "original_implementer_session_id"

  - id: "initialize-review-resolution"
    condition: "{{task_already_done}} != 'true'"
    type: "bash"
    timeout: 30
    command: |
      set -eu
      python3 - <<'PYEOF'
      import json
      import os

      status = os.environ["IMPLEMENTATION_STATUS"]
      session_valid = os.environ["SESSION_ID_VALID"] == "true"
      blocker = os.environ["IMPLEMENTATION_BLOCKER"].strip()
      if status in {"DONE", "DONE_WITH_CONCERNS"} and session_valid:
          resolution = {
              "outcome": "PENDING",
              "no_load_bearing": "false",
              "terminal": "false",
              "round": "0",
              "advisory_findings": "",
              "blocker": "",
          }
      else:
          resolution = {
              "outcome": "BLOCKED",
              "no_load_bearing": "false",
              "terminal": "true",
              "round": "0",
              "advisory_findings": "",
              "blocker": blocker or "implementation did not produce a resumable completed report",
          }
      print(json.dumps(resolution))
      PYEOF
    env:
      IMPLEMENTATION_STATUS: "{{implementation_report.status}}"
      SESSION_ID_VALID: "{{implementation_report.session_id_valid}}"
      IMPLEMENTATION_BLOCKER: "{{implementation_report.blocker}}"
    parse_json: true
    output: "review_resolution"

  # --- 2b: Uniform five-round packet review and bounded remediation lifecycle ---
  - id: "review-fix-loop"
    condition: "{{task_already_done}} != 'true' and {{review_resolution.outcome}} == 'PENDING'"
    while_condition: "true"
    break_when: "{{review_resolution.terminal}} == 'true'"
    max_while_iterations: 5
    steps:
      # Every review round begins from the durable task base SHA through current HEAD.
      - id: "build-review-package"
        type: "bash"
        timeout: 30
        command: |
          set -eu
          BASE_SHA=$(cat "{{task_state.task_base_sha_path}}")
          HEAD_SHA=$(git rev-parse HEAD)
          PACKAGE="{{state_dir}}/review-packages/{{task_state.task_slug}}-round-{{_loop_iteration}}.md"
          {
            printf '# Review Package\n\n'
            printf 'Base: %s\nHead: %s\n\n' "$BASE_SHA" "$HEAD_SHA"
            printf '## Diff Stat\n\n```text\n'
            git diff --stat "$BASE_SHA..$HEAD_SHA"
            printf '```\n\n## Commits\n\n```text\n'
            git log --oneline "$BASE_SHA..$HEAD_SHA"
            printf '```\n\n## Diff\n\n```diff\n'
            git diff "$BASE_SHA..$HEAD_SHA" --
            printf '```\n'
          } > "$PACKAGE"
          cat "$PACKAGE"
        output: "review_package"

      - id: "review-fast"
        condition: "{{current_task.review_model_role}} == 'fast'"
        agent: "kenergy:reviewer"
        model_role: "fast"
        prompt: &review_prompt |
          TASK GOAL
          =========
          Task ID: {{current_task.task_id}}
          Description: {{current_task.description}}
          Specification: {{current_task.spec}}
          Acceptance Criteria: {{current_task.acceptance_criteria}}
          Interfaces: {{current_task.interfaces}}

          REVIEW PACKAGE
          ==============
          {{review_package}}
        output: "review_verdict"
        timeout: 600
        retry:
          max_attempts: 3
          backoff: exponential
          initial_delay: 5
          max_delay: 120

      - id: "review-critique"
        condition: "{{current_task.review_model_role}} == 'critique'"
        agent: "kenergy:reviewer"
        model_role: "critique"
        prompt: *review_prompt
        output: "review_verdict"
        timeout: 600
        retry:
          max_attempts: 3
          backoff: exponential
          initial_delay: 5
          max_delay: 120

      - id: "review-reasoning"
        condition: "{{current_task.review_model_role}} == 'reasoning'"
        agent: "kenergy:reviewer"
        model_role: "reasoning"
        prompt: *review_prompt
        output: "review_verdict"
        timeout: 600
        retry:
          max_attempts: 3
          backoff: exponential
          initial_delay: 5
          max_delay: 120

      - id: "analyze-review-verdict"
        type: "bash"
        timeout: 30
        command: |
          set -eu
          python3 - <<'PYEOF'
          import json
          import os

          lines = os.environ.get("REVIEW_VERDICT", "").splitlines()
          exact_pass = any(line == "REVIEW: PASS" for line in lines)
          load_bearing = [line.strip() for line in lines if "[LOAD-BEARING]" in line]
          advisory = [line.strip() for line in lines if "[ADVISORY]" in line]
          unclassified_failure = not exact_pass and not load_bearing and not advisory
          no_load_bearing = not load_bearing and not unclassified_failure

          print(json.dumps({
              "exact_pass": "true" if exact_pass else "false",
              "no_load_bearing": "true" if no_load_bearing else "false",
              "load_bearing_remaining": "false" if no_load_bearing else "true",
              "advisory_findings": "\n".join(advisory),
              "load_bearing_findings": "\n".join(load_bearing),
              "unclassified_failure": "true" if unclassified_failure else "false",
          }))
          PYEOF
        env:
          REVIEW_VERDICT: "{{review_verdict}}"
        parse_json: true
        output: "review_evaluation"

      - id: "resolve-review-iteration"
        type: "bash"
        timeout: 30
        command: |
          set -eu
          python3 - <<'PYEOF'
          import json
          import os

          exact_pass = os.environ["EXACT_PASS"] == "true"
          no_load_bearing = os.environ["NO_LOAD_BEARING"] == "true"
          round_number = int(os.environ["ROUND"])
          advisory_findings = os.environ["ADVISORY_FINDINGS"].strip()
          load_bearing_findings = os.environ["LOAD_BEARING_FINDINGS"].strip()
          unclassified_failure = os.environ["UNCLASSIFIED_FAILURE"] == "true"

          if exact_pass and no_load_bearing:
              resolution = {
                  "outcome": "PASS",
                  "no_load_bearing": "true",
                  "terminal": "true",
                  "round": str(round_number),
                  "advisory_findings": "",
                  "blocker": "",
              }
          elif exact_pass:
              resolution = {
                  "outcome": "BLOCKED",
                  "no_load_bearing": "false",
                  "terminal": "true",
                  "round": str(round_number),
                  "advisory_findings": advisory_findings,
                  "blocker": "review reported REVIEW: PASS while retaining [LOAD-BEARING] findings",
              }
          elif round_number >= 5 and no_load_bearing:
              resolution = {
                  "outcome": "APPROVED_WITH_PARKED",
                  "no_load_bearing": "true",
                  "terminal": "true",
                  "round": str(round_number),
                  "advisory_findings": advisory_findings,
                  "blocker": "",
              }
          elif round_number >= 5:
              blocker = load_bearing_findings
              if not blocker and unclassified_failure:
                  blocker = "review failed without classified [LOAD-BEARING] or [ADVISORY] findings"
              resolution = {
                  "outcome": "BLOCKED",
                  "no_load_bearing": "false",
                  "terminal": "true",
                  "round": str(round_number),
                  "advisory_findings": advisory_findings,
                  "blocker": blocker or "load-bearing review findings remain after bounded review",
              }
          else:
              resolution = {
                  "outcome": "PENDING",
                  "no_load_bearing": "false",
                  "terminal": "false",
                  "round": str(round_number),
                  "advisory_findings": advisory_findings,
                  "blocker": "",
              }
          print(json.dumps(resolution))
          PYEOF
        env:
          EXACT_PASS: "{{review_evaluation.exact_pass}}"
          NO_LOAD_BEARING: "{{review_evaluation.no_load_bearing}}"
          ROUND: "{{_loop_iteration}}"
          ADVISORY_FINDINGS: "{{review_evaluation.advisory_findings}}"
          LOAD_BEARING_FINDINGS: "{{review_evaluation.load_bearing_findings}}"
          UNCLASSIFIED_FAILURE: "{{review_evaluation.unclassified_failure}}"
        parse_json: true
        output: "review_resolution"

      # Rounds 1-3 resume only the original implementer; no fresh replacement is allowed.
      - id: "resume-original-implementer"
        condition: "{{review_resolution.outcome}} == 'PENDING' and {{_loop_iteration}} <= 3"
        agent: "kenergy:plan-writer"
        model_role: "fast"
        prompt: |
          Call delegate exactly once to resume the original implementer:

          delegate(
            session_id="{{original_implementer_session_id}}",
            instruction="Fix only the load-bearing findings in this review, using this precomputed packet instead of re-running Git discovery: {{review_verdict}}\n\nREVIEW PACKAGE:\n{{review_package}}\n\nRerun the task's exact verification, commit, and return the full STATUS/SESSION_ID report.",
            model_role="{{current_task.implementation_model_role}}"
          )

          Return the delegate result verbatim. Do not edit files yourself. If resume fails,
          return STATUS: BLOCKED with the exact error.
        output: "task_implementation"
        timeout: 3600
        retry:
          max_attempts: 3
          backoff: exponential
          initial_delay: 5
          max_delay: 120

      # Rounds 4-5 use a fresh escalated implementer only after the original session budget.
      - id: "escalate-implementer-coding"
        condition: "{{review_resolution.outcome}} == 'PENDING' and {{_loop_iteration}} >= 4 and {{current_task.escalated_model_role}} == 'coding'"
        agent: "kenergy:implementer"
        model_role: "coding"
        prompt: &escalated_fix_prompt |
          FRESH ESCALATED REVIEW FIX
          ==========================

          TASK GOAL
          =========
          Task ID: {{current_task.task_id}}
          Description: {{current_task.description}}
          Specification: {{current_task.spec}}
          Acceptance Criteria: {{current_task.acceptance_criteria}}
          Interfaces: {{current_task.interfaces}}
          Files: {{current_task.files}}

          REVIEW PACKAGE
          ==============
          {{review_package}}

          OPEN FINDINGS
          =============
          {{review_verdict}}

          Fix only the open load-bearing findings. Do not add scope, redo Git
          discovery, push, merge, open a PR, or deploy. Rerun the task's exact
          static analysis and VDD verification, make one atomic commit, and return
          the complete response contract below.

          RESPONSE CONTRACT
          =================
          STATUS: DONE | DONE_WITH_CONCERNS | BLOCKED | NEEDS_CONTEXT
          SESSION_ID: Copy the full Session ID from your injected environment context.
          TASK_ID: {{current_task.task_id}}
          FILES_CHANGED: list exact paths
          STATIC_ANALYSIS: exact command and output
          VERIFICATION: exact command, expected result, and actual output
          COMMIT: full commit hash and subject
          CONCERNS: NONE or specific concerns
          BLOCKER: NONE or the exact blocker
        output: "task_implementation"
        timeout: 3600
        retry:
          max_attempts: 3
          backoff: exponential
          initial_delay: 5
          max_delay: 120

      - id: "escalate-implementer-reasoning"
        condition: "{{review_resolution.outcome}} == 'PENDING' and {{_loop_iteration}} >= 4 and {{current_task.escalated_model_role}} == 'reasoning'"
        agent: "kenergy:implementer"
        model_role: "reasoning"
        prompt: *escalated_fix_prompt
        output: "task_implementation"
        timeout: 3600
        retry:
          max_attempts: 3
          backoff: exponential
          initial_delay: 5
          max_delay: 120

      - id: "escalate-implementer-critical-ops"
        condition: "{{review_resolution.outcome}} == 'PENDING' and {{_loop_iteration}} >= 4 and {{current_task.escalated_model_role}} == 'critical-ops'"
        agent: "kenergy:implementer"
        model_role: "critical-ops"
        prompt: *escalated_fix_prompt
        output: "task_implementation"
        timeout: 3600
        retry:
          max_attempts: 3
          backoff: exponential
          initial_delay: 5
          max_delay: 120

      - id: "extract-fix-implementation-report"
        condition: "{{review_resolution.outcome}} == 'PENDING'"
        type: "bash"
        timeout: 30
        command: |
          set -eu
          python3 - <<'PYEOF'
          import json
          import os
          import re

          raw = os.environ.get("IMPLEMENTATION_OUTPUT", "")
          status_matches = re.findall(
              r"(?m)^STATUS:[ \t]*(DONE|DONE_WITH_CONCERNS|BLOCKED|NEEDS_CONTEXT)[ \t]*$",
              raw,
          )
          session_matches = re.findall(r"(?m)^SESSION_ID:[ \t]*([^\s]+)[ \t]*$", raw)
          session_id = session_matches[0] if len(session_matches) == 1 else ""
          session_id_valid = bool(
              re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{15,}", session_id)
          )

          blocker = ""
          if len(status_matches) != 1:
              status = "BLOCKED"
              blocker = "missing or ambiguous STATUS line in implementer fix response"
          else:
              status = status_matches[0]

          if not session_id_valid:
              status = "BLOCKED"
              blocker = "missing or invalid full SESSION_ID in implementer fix response"
          elif status not in {"DONE", "DONE_WITH_CONCERNS"}:
              blocker = "implementer fix did not report a completed task"

          print(json.dumps({
              "status": status,
              "session_id": session_id,
              "session_id_valid": "true" if session_id_valid else "false",
              "blocker": blocker,
          }))
          PYEOF
        env:
          IMPLEMENTATION_OUTPUT: "{{task_implementation}}"
        parse_json: true
        output: "implementation_report"

      - id: "resolve-fix-status"
        condition: "{{review_resolution.outcome}} == 'PENDING'"
        type: "bash"
        timeout: 30
        command: |
          set -eu
          python3 - <<'PYEOF'
          import json
          import os

          status = os.environ["IMPLEMENTATION_STATUS"]
          session_valid = os.environ["SESSION_ID_VALID"] == "true"
          blocker = os.environ["IMPLEMENTATION_BLOCKER"].strip()
          round_number = os.environ["ROUND"]
          if status in {"DONE", "DONE_WITH_CONCERNS"} and session_valid:
              resolution = {
                  "outcome": "PENDING",
                  "no_load_bearing": "false",
                  "terminal": "false",
                  "round": round_number,
                  "advisory_findings": "",
                  "blocker": "",
              }
          else:
              resolution = {
                  "outcome": "BLOCKED",
                  "no_load_bearing": "false",
                  "terminal": "true",
                  "round": round_number,
                  "advisory_findings": "",
                  "blocker": blocker or "fix attempt did not produce a resumable completed report",
              }
          print(json.dumps(resolution))
          PYEOF
        env:
          IMPLEMENTATION_STATUS: "{{implementation_report.status}}"
          SESSION_ID_VALID: "{{implementation_report.session_id_valid}}"
          IMPLEMENTATION_BLOCKER: "{{implementation_report.blocker}}"
          ROUND: "{{_loop_iteration}}"
        parse_json: true
        output: "review_resolution"

  # A blocked initial report, bad session ID, failed resume, or fifth load-bearing
  # review is terminal and must never write a ledger completion entry.
  - id: "stop-on-blocked-outcome"
    condition: "{{task_already_done}} != 'true' and {{review_resolution.outcome}} == 'BLOCKED'"
    type: "bash"
    timeout: 30
    command: |
      set -eu
      printf 'BLOCKED: task %s — %s\n' "$TASK_ID" "$BLOCKER"
      exit 1
    env:
      TASK_ID: "{{current_task.task_id}}"
      BLOCKER: "{{review_resolution.blocker}}"

  # Ledger completion is possible only after a completed implementation and a
  # safe terminal review result with no load-bearing finding remaining.
  - id: "write-ledger-checkpoint"
    condition: "({{implementation_report.status}} == 'DONE' or {{implementation_report.status}} == 'DONE_WITH_CONCERNS') and ({{review_resolution.outcome}} == 'PASS' or {{review_resolution.outcome}} == 'APPROVED_WITH_PARKED') and {{review_resolution.no_load_bearing}} == 'true'"
    type: "bash"
    timeout: 30
    command: |
      set -eu
      python3 - <<'PYEOF'
      import os
      import subprocess
      from pathlib import Path

      ledger = Path(os.environ["LEDGER_PATH"]).expanduser()
      brief_path = Path(os.environ["TASK_BRIEF_PATH"]).expanduser()
      base_path = Path(os.environ["TASK_BASE_SHA_PATH"]).expanduser()
      task_id = os.environ["TASK_ID"].strip()
      task_slug = os.environ["TASK_SLUG"]
      status = os.environ["IMPLEMENTATION_STATUS"]
      outcome = os.environ["REVIEW_OUTCOME"]
      no_load_bearing = os.environ["NO_LOAD_BEARING"] == "true"
      round_number = os.environ["REVIEW_ROUND"]
      advisory_findings = os.environ["ADVISORY_FINDINGS"]
      expected_first_line = f"# Plan: {os.environ['PLAN_IDENTITY']}"

      if status not in {"DONE", "DONE_WITH_CONCERNS"}:
          raise SystemExit("BLOCKED: refusing ledger write for incomplete task status")
      if outcome not in {"PASS", "APPROVED_WITH_PARKED"}:
          raise SystemExit("BLOCKED: refusing ledger write for unsafe review outcome")
      if not no_load_bearing:
          raise SystemExit("BLOCKED: refusing ledger write while load-bearing findings remain")
      if not ledger.is_file():
          raise SystemExit(f"BLOCKED: ledger not found: {ledger}")

      lines = ledger.read_text(encoding="utf-8").splitlines()
      if not lines or lines[0] != expected_first_line:
          raise SystemExit("BLOCKED: ledger identity mismatch; refusing cross-plan state")
      if not brief_path.is_file():
          raise SystemExit(f"BLOCKED: task brief not found: {brief_path}")
      brief_lines = brief_path.read_text(encoding="utf-8").splitlines()
      if not brief_lines or brief_lines[0] != f"# Task Brief: {task_id}":
          raise SystemExit("BLOCKED: task brief identity mismatch")
      if not base_path.is_file():
          raise SystemExit(f"BLOCKED: task base SHA not found: {base_path}")

      base_sha = base_path.read_text(encoding="utf-8").strip()
      if not base_sha:
          raise SystemExit("BLOCKED: task base SHA is empty")
      head_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

      try:
          completed_index = lines.index("## Completed Tasks")
          parked_index = lines.index("## Parked Findings")
      except ValueError as error:
          raise SystemExit("BLOCKED: ledger missing required section") from error
      if completed_index > parked_index:
          raise SystemExit("BLOCKED: ledger sections are out of order")

      entry = f"- [x] {task_id} — {head_sha} — {outcome}"
      entry_prefix = f"- [x] {task_id} —"
      if not any(line.startswith(entry_prefix) for line in lines):
          lines[parked_index:parked_index] = [entry, ""]

      if outcome == "APPROVED_WITH_PARKED":
          advisory_lines = [
              line.strip()
              for line in advisory_findings.splitlines()
              if "[ADVISORY]" in line
          ]
          if not advisory_lines:
              raise SystemExit(
                  "BLOCKED: APPROVED_WITH_PARKED requires classified [ADVISORY] findings"
              )
          parked_index = lines.index("## Parked Findings")
          parked_entries = [
              f"- {task_id} — round {round_number} — {finding.removeprefix('- ').strip()} — "
              "non-load-bearing after bounded review"
              for finding in advisory_lines
          ]
          lines[parked_index + 1:parked_index + 1] = [*parked_entries, ""]

      ledger.write_text("\n".join(lines) + "\n", encoding="utf-8")
      print(outcome)
      PYEOF
    env:
      TASK_ID: "{{current_task.task_id}}"
      TASK_SLUG: "{{task_state.task_slug}}"
      TASK_BRIEF_PATH: "{{task_state.task_brief_path}}"
      TASK_BASE_SHA_PATH: "{{task_state.task_base_sha_path}}"
      PLAN_IDENTITY: "{{plan_identity}}"
      LEDGER_PATH: "{{ledger_path}}"
      IMPLEMENTATION_STATUS: "{{implementation_report.status}}"
      REVIEW_OUTCOME: "{{review_resolution.outcome}}"
      NO_LOAD_BEARING: "{{review_resolution.no_load_bearing}}"
      REVIEW_ROUND: "{{review_resolution.round}}"
      ADVISORY_FINDINGS: "{{review_resolution.advisory_findings}}"
    output: "task_outcome"
